<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07152f">
<title>Christmas Countdown Ultra 🎄</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: #07152f;
  color: white;
  font-family: Georgia, "Times New Roman", serif;
  text-align: center;
}

.stage {
  position: relative;
  width: min(100%, 900px);
  margin: 0 auto;
  overflow: hidden;
  line-height: 0;
  background: #07152f;
}

.art {
  display: block;
  width: 100%;
  height: auto;
}

.live-countdown {
  position: absolute;
  top: 44.4%;
  left: 27.3%;
  width: 45.4%;
  height: 11.1%;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2%;
}

.time {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-width: 0;
  border-radius: 12px;
  background: rgba(5, 31, 46, .96);
  border: 1px solid rgba(255, 221, 137, .85);
  line-height: 1.1;
}

.num {
  font-family: Arial, sans-serif;
  font-size: clamp(13px, 4vw, 36px);
  font-weight: 800;
  color: #ffdf8a;
  font-variant-numeric: tabular-nums;
}

.unit {
  margin-top: 5px;
  color: #f0f5ff;
  font: 700 clamp(5px, .95vw, 10px)/1.2 Arial, sans-serif;
  letter-spacing: 1px;
}

.live-message {
  position: absolute;
  top: 58.3%;
  left: 20%;
  width: 60%;
  color: #ffdf8a;
  font-size: clamp(10px, 2.5vw, 22px);
  font-weight: bold;
  line-height: 1.2;
  text-shadow: 0 2px 5px #15243b;
}

.art-button {
  position: absolute;
  border: 0;
  background: transparent;
  cursor: pointer;
  color: transparent;
  border-radius: 30px;
}

.art-button:focus-visible {
  outline: 3px solid #ffe5a0;
}

.snow-button {
  top: 71.2%;
  left: 27.9%;
  width: 24.5%;
  height: 3.75%;
}

.surprise-button {
  top: 71.2%;
  left: 49%;
  width: 23.8%;
  height: 3.75%;
}

.wish-button {
  top: 87.3%;
  left: 40%;
  width: 20%;
  height: 3.7%;
}

.result {
  display: none;
  position: absolute;
  left: 20%;
  width: 60%;
  padding: 10px;
  line-height: 1.4;
  font: clamp(10px, 1.8vw, 15px) Arial, sans-serif;
  background: rgba(4, 23, 39, .98);
  color: #fff0c2;
  border: 1px solid #e8c36c;
  border-radius: 10px;
  z-index: 5;
}

#surprise { top: 76%; }
#wish { top: 91%; }

.snowflake {
  position: fixed;
  top: -25px;
  z-index: 20;
  color: white;
  pointer-events: none;
  text-shadow: 0 0 7px white;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translate(var(--drift), 110vh) rotate(360deg);
    opacity: .1;
  }
}

.below {
  max-width: 720px;
  margin: auto;
  padding: 18px 16px 32px;
  line-height: 1.6;
  color: #dbeaff;
}

.below button {
  margin: 5px;
  padding: 11px 18px;
  border: 1px solid #ffdf8a;
  border-radius: 24px;
  background: linear-gradient(#138751, #075332);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.below button:hover { filter: brightness(1.15); }

.hint {
  font: 12px Arial, sans-serif;
  color: #b8cce3;
}

@media (prefers-reduced-motion: reduce) {
  .snowflake { animation-duration: .01ms !important; }
}
</style>
</head>

<body>

<div class="stage" id="stage">

  <img
    class="art"
    src="christmas-wonderland.png"
    alt="A magical snowy Christmas village, glowing Christmas tree and Santa's sleigh"
  >

  <div class="live-countdown" aria-label="Countdown to Christmas">
    <div class="time">
      <span class="num" id="days">000</span>
      <span class="unit">DAYS</span>
    </div>
    <div class="time">
      <span class="num" id="hours">00</span>
      <span class="unit">HOURS</span>
    </div>
    <div class="time">
      <span class="num" id="minutes">00</span>
      <span class="unit">MINUTES</span>
    </div>
    <div class="time">
      <span class="num" id="seconds">00</span>
      <span class="unit">SECONDS</span>
    </div>
  </div>

  <div class="live-message" id="message" aria-live="polite">
    🎄 Believe in the magic of Christmas! 🎄
  </div>

  <button class="art-button snow-button"
    onclick="makeSnow(100)" aria-label="Let it snow">Snow</button>

  <button class="art-button surprise-button"
    onclick="showSurprise()" aria-label="Christmas surprise">Surprise</button>

  <button class="art-button wish-button"
    onclick="makeWish()" aria-label="Make a Christmas wish">Wish</button>

  <div class="result" id="surprise" aria-live="polite"></div>
  <div class="result" id="wish" aria-live="polite"></div>
</div>

<section class="below">
  <p>❄️ Your own little corner of Christmas magic. ❄️</p>
  <p class="hint">Make it snow, discover a surprise, or make a wish!</p>
  <button onclick="makeSnow(100)">❄️ Let it snow!</button>
  <button onclick="showSurprise()">🎁 Christmas surprise</button>
  <button onclick="makeWish()">🌟 Make a wish</button>
</section>

<script>
/*
  The countdown ends at midnight at the START of 25 December.
  The computer's local time zone is used.
*/

function nextChristmas() {
  const now = new Date();
  const year = now.getFullYear();

  let target = new Date(year, 11, 25, 0, 0, 0, 0);

  // If this year's Christmas midnight has passed, use next year.
  if (now.getTime() >= target.getTime()) {
    target = new Date(year + 1, 11, 25, 0, 0, 0, 0);
  }

  return target;
}

function updateCountdown() {
  const now = new Date();
  const target = nextChristmas();
  const difference = Math.max(0, target.getTime() - now.getTime());

  const days = Math.floor(difference / 86400000);
  const hours = Math.floor((difference % 86400000) / 3600000);
  const minutes = Math.floor((difference % 3600000) / 60000);
  const seconds = Math.floor((difference % 60000) / 1000);

  document.getElementById("days").textContent =
    String(days).padStart(3, "0");

  document.getElementById("hours").textContent =
    String(hours).padStart(2, "0");

  document.getElementById("minutes").textContent =
    String(minutes).padStart(2, "0");

  document.getElementById("seconds").textContent =
    String(seconds).padStart(2, "0");

  document.getElementById("message").textContent =
    difference === 0
      ? "🎄 MERRY CHRISTMAS! 🎅"
      : days <= 7
        ? "🎅 IT'S ALMOST CHRISTMAS! 🎁"
        : "🎄 Believe in the magic of Christmas! 🎄";
}

updateCountdown();
setInterval(updateCountdown, 1000);

// Falling snow
function makeSnow(amount) {
  for (let i = 0; i < amount; i++) {
    setTimeout(() => {
      const flake = document.createElement("span");
      flake.className = "snowflake";
      flake.textContent = ["❄", "❅", "✧", "•"][
        Math.floor(Math.random() * 4)
      ];

      const duration = 5 + Math.random() * 7;
      flake.style.left = Math.random() * 100 + "vw";
      flake.style.fontSize = 10 + Math.random() * 19 + "px";
      flake.style.opacity = .4 + Math.random() * .6;
      flake.style.animationDuration = duration + "s";
      flake.style.setProperty(
        "--drift", (Math.random() * 150 - 75) + "px"
      );

      document.body.appendChild(flake);
      setTimeout(() => flake.remove(), duration * 1000);
    }, i * 25);
  }
}

setInterval(() => {
  if (!document.hidden) makeSnow(2);
}, 1500);

makeSnow(28);

// Christmas surprises
function showSurprise() {
  const messages = [
    "🎄 Spread kindness, enjoy something delicious, and make a memory!",
    "🎅 You are promoted to Chief Christmas Cheer Officer!",
    "🎁 May your home be full of laughter, love and surprises.",
    "✨ The reindeer say you deserve extra Christmas pudding!",
    "☕ Get cosy, enjoy a warm drink, and embrace the magic."
  ];

  const box = document.getElementById("surprise");
  box.textContent = messages[Math.floor(Math.random() * messages.length)];
  box.style.display = "block";
}

function makeWish() {
  const wishes = [
    "❤️ May your Christmas be filled with happiness and laughter.",
    "✨ May something wonderful surprise you this Christmas.",
    "☕ May your home be warm and your cocoa extra chocolatey.",
    "🌟 May the new year bring exciting adventures and memories.",
    "🎄 May kindness, peace and Christmas magic follow you."
  ];

  const box = document.getElementById("wish");
  box.textContent = wishes[Math.floor(Math.random() * wishes.length)];
  box.style.display = "block";
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) updateCountdown();
});
</script>

</body>
</html>
